<!doctype html>
<html lang="en">
  <head>

    <!-- Primary Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Master English grammar offline. Built for Francophone learners in Cameroon. Works 100% without internet." />
    <title>OffGrid English - Learn Grammar Offline</title>

    <!-- Favicon -->
